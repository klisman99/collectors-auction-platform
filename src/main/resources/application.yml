spring:
  application:
    name: collectors-auction-platform
  modulith:
    detection-strategy: explicitly-annotated
    events:
      republish-outstanding-events-on-restart: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/collectors_auction}
    username: ${DATABASE_USERNAME:collectors}
    password: ${DATABASE_PASSWORD:collectors}
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  # Tomcat rewrites getRemoteAddr() from X-Forwarded-For only when the
  # connection comes from its internal-proxy allowlist. Nginx overwrites the
  # header at the edge, so the controller never has to trust client input.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:collectors-auction-platform}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

springdoc:
  api-docs:
    version: OPENAPI_3_1

logging:
  structured:
    format:
      console: logstash

platform:
  identity:
    initial-administrator:
      # Configure both values through deployment secrets to create the first
      # active administrator. Blank values leave bootstrap disabled.
      email: ${INITIAL_ADMINISTRATOR_EMAIL:}
      password: ${INITIAL_ADMINISTRATOR_PASSWORD:}
  mail:
    from: ${MAIL_FROM:no-reply@collectors-auction.local}
    web-base-url: ${PUBLIC_WEB_BASE_URL:http://localhost:8080}
  image-storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:collectors-images}
