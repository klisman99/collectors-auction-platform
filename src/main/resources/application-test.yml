spring:
  datasource:
    url: jdbc:h2:mem:collectors-auction;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never

platform:
  auctions:
    reconciliation-delay-ms: 60000
  settlement:
    reconciliation-delay-ms: 60000
  identity:
    initial-administrator:
      email: bootstrap-test@example.com
      password: bootstrap administrator password

logging:
  structured:
    format:
      console: 

management:
  health:
    image-storage:
      enabled: false
    mail:
      enabled: false
  tracing:
    export:
      otlp:
        enabled: false
