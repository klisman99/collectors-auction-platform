name: collectors-auction-platform

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collectors_auction}
      POSTGRES_USER: ${POSTGRES_USER:-collectors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collectors}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-collectors}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-collectors-local-secret}
      S3_BUCKET: ${S3_BUCKET:-collectors-images}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${S3_API_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  backend:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-collectors_auction}
      DATABASE_USERNAME: ${POSTGRES_USER:-collectors}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-collectors}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-collectors}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-collectors-local-secret}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      S3_BUCKET: ${S3_BUCKET:-collectors-images}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      PUBLIC_WEB_BASE_URL: http://localhost:${WEB_PORT:-8080}
      INITIAL_ADMINISTRATOR_EMAIL: ${INITIAL_ADMINISTRATOR_EMAIL:-}
      INITIAL_ADMINISTRATOR_PASSWORD: ${INITIAL_ADMINISTRATOR_PASSWORD:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      SESSION_COOKIE_SECURE: "false"
    expose:
      - "8080"

  web:
    build:
      context: ./web
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.1.3
    profiles: ["observability"]
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  tempo:
    image: grafana/tempo:2.10.7
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${OTLP_PORT:-4318}:4318"

volumes:
  postgres-data:
  seaweedfs-data:
  prometheus-data:
  grafana-data:
  tempo-data:
