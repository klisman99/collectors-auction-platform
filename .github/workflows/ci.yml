name: Verify platform baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: collectors_auction
          POSTGRES_USER: collectors
          POSTGRES_PASSWORD: collectors
        options: >-
          --health-cmd "pg_isready -U collectors -d collectors_auction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25 LTS
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node 24 LTS and pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11.19.0
          runtime: node@24.20.0
          working-directory: web
          cache: true
          install: false

      - name: Validate documentation
        run: node scripts/check-docs.mjs

      - name: Check Java formatting conventions
        shell: pwsh
        run: ./scripts/check-java-format.ps1

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Verify frontend
        run: pnpm --dir web run ci

      - name: Detect OpenAPI client drift
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/collectors_auction
          DATABASE_USERNAME: collectors
          DATABASE_PASSWORD: collectors
        shell: bash
        run: |
          ./mvnw --batch-mode --no-transfer-progress spring-boot:run > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"; cat backend.log' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health/liveness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/actuator/health/liveness >/dev/null
          pnpm --dir web run contract:check

      - name: Build backend container image
        run: docker build --tag collectors-auction-platform-backend:${{ github.sha }} .

      - name: Build frontend container image
        run: docker build --tag collectors-auction-platform-web:${{ github.sha }} ./web
