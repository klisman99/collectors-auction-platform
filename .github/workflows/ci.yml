name: Verify reproducible MVP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: collectors_auction
          POSTGRES_USER: collectors
          POSTGRES_PASSWORD: collectors
        options: >-
          --health-cmd "pg_isready -U collectors -d collectors_auction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25 LTS
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node 24 LTS and pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11.19.0
          runtime: node@24.20.0
          working-directory: web
          cache: true
          install: false

      - name: Validate documentation
        run: node scripts/check-docs.mjs

      - name: Verify proof startup failure diagnostics
        run: bash scripts/tests/prove-mvp-startup.sh

      - name: Check Java formatting conventions
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      - name: Verify backend without skipped test layers
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = [ElementTree.parse(path).getroot() for path in Path('target/surefire-reports').glob('TEST-*.xml')]
          assert reports, 'Backend test reports are missing'
          assert sum(int(report.get('tests', 0)) for report in reports) > 0
          assert all(int(report.get('skipped', 0)) == 0 for report in reports), 'A required backend test layer was skipped'
          PYTHON

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Verify frontend
        run: pnpm --dir web run ci

      - name: Detect OpenAPI client drift
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/collectors_auction
          DATABASE_USERNAME: collectors
          DATABASE_PASSWORD: collectors
          INITIAL_ADMINISTRATOR_EMAIL: admin-ci@example.com
          INITIAL_ADMINISTRATOR_PASSWORD: ci administrator password
        shell: bash
        run: |
          ./mvnw --batch-mode --no-transfer-progress spring-boot:run > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; cat backend.log' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health/liveness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/actuator/health/liveness >/dev/null
          pnpm --dir web run contract:check

      - name: Build backend container image
        run: docker build --tag collectors-auction-platform-backend:${{ github.sha }} .

      - name: Build frontend container image
        run: docker build --tag collectors-auction-platform-web:${{ github.sha }} ./web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node 24 LTS and pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11.19.0
          runtime: node@24.20.0
          working-directory: web
          cache: true
          install: false

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run isolated browser and operational acceptance proof
        run: bash scripts/prove-mvp.sh

      - name: Assert clean tracked checkout
        run: git diff --exit-code

      # Stable release verified 2026-09-19:
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mvp-proof-${{ github.sha }}
          path: |
            artifacts/proof/environment.txt
            artifacts/proof/build.log
            artifacts/proof/results.json
            artifacts/proof/readiness.json
            artifacts/proof/prometheus.json
            artifacts/proof/containers.txt
            artifacts/proof/backup.json
          if-no-files-found: warn
          retention-days: 14
